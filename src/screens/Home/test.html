<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>School Pickup Manager</title>
    <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
    <style>
      :root {
        --primary: #5563de;
        --secondary: #74abe2;
        --success: #4caf50;
        --error: #f44336;
        --warning: #ff9800;
        --text: #2c3e50;
      }

      body {
        margin: 0;
        font-family: 'Segoe UI', system-ui, sans-serif;
        background: linear-gradient(135deg, #f3f4f6, #e5e7eb);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        color: var(--text);
      }

      /* Notification System */
      .notification-container {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 1000;
        max-width: 350px;
      }

      .notification {
        padding: 15px 25px;
        margin-bottom: 15px;
        border-radius: 8px;
        color: white;
        display: flex;
        align-items: center;
        gap: 12px;
        animation: slideIn 0.3s ease-out;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }

      .notification.success {
        background: var(--success);
      }
      .notification.error {
        background: var(--error);
      }
      .notification.warning {
        background: var(--warning);
      }
      .notification.info {
        background: var(--primary);
      }

      @keyframes slideIn {
        from {
          transform: translateX(100%);
        }
        to {
          transform: translateX(0);
        }
      }

      /* Login Card */
      .login-card {
        background: white;
        border-radius: 16px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        width: min(90%, 400px);
        padding: 2.5rem;
        transition: transform 0.2s ease;
      }

      .login-card:hover {
        transform: translateY(-2px);
      }

      .login-form {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }

      .input-group {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .input-group input {
        padding: 12px 16px;
        border: 2px solid #e2e8f0;
        border-radius: 8px;
        font-size: 1rem;
        transition: border-color 0.2s ease;
      }

      .input-group input:focus {
        border-color: var(--primary);
        outline: none;
      }

      .login-btn {
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        color: white;
        padding: 14px;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.2s ease;
      }

      .login-btn:hover {
        opacity: 0.9;
      }

      /* Main Container */
      #mainContainer {
        background: white;
        border-radius: 16px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        padding: 2rem;
        width: min(90%, 800px);
        margin: 2rem auto;
        display: none;
      }

      .status-indicator {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 20px;
        background: #f8f9fa;
        border-radius: 8px;
        margin-bottom: 2rem;
      }

      .status-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #ddd;
      }

      .status-dot.connected {
        background: var(--success);
      }
      .status-dot.disconnected {
        background: var(--error);
      }

      /* Action Sections */
      .section {
        background: #f8f9fa;
        border-radius: 12px;
        padding: 1.5rem;
        margin-bottom: 1.5rem;
      }

      .section h3 {
        margin: 0 0 1rem 0;
        color: var(--primary);
      }

      .input-row {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
        margin-bottom: 1rem;
      }

      .input-row input {
        flex: 1 1 200px;
        padding: 10px 14px;
        border: 2px solid #e2e8f0;
        border-radius: 8px;
      }

      .action-btn {
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 500;
        transition: transform 0.2s ease;
      }

      .action-btn:hover {
        transform: translateY(-1px);
      }

      .action-btn:disabled {
        opacity: 0.7;
        cursor: not-allowed;
      }

      /* Logs Section */
      #logsContainer {
        background: #1a1a1a;
        color: #fff;
        padding: 1rem;
        border-radius: 8px;
        max-height: 200px;
        overflow-y: auto;
        font-family: monospace;
        font-size: 0.9rem;
      }

      .log-entry {
        padding: 4px 0;
        border-bottom: 1px solid #333;
      }

      .log-entry.info {
        color: #74abe2;
      }
      .log-entry.success {
        color: #4caf50;
      }
      .log-entry.error {
        color: #f44336;
      }
    </style>
  </head>
  <body>
    <div class="notification-container"></div>

    <!-- Login Section -->
    <div class="login-card">
      <h2 class="login-title">Parent Portal</h2>
      <form class="login-form" id="loginForm">
        <div class="input-group">
          <label for="loginEmail">Email:</label>
          <input type="email" id="loginEmail" required />
        </div>
        <div class="input-group">
          <label for="loginPassword">Password:</label>
          <input type="password" id="loginPassword" required />
        </div>
        <button type="submit" class="login-btn">Sign In</button>
      </form>
    </div>

    <!-- Main Interface -->
    <div id="mainContainer">
      <div class="status-indicator">
        <div class="status-dot"></div>
        <span id="statusText">Connecting...</span>
      </div>

      <!-- Student Section -->
      <div class="section">
        <h3>Student Information</h3>
        <button class="action-btn" id="fetchStudentBtn">
          🔄 Refresh Student Data
        </button>
        <pre id="studentData" style="white-space: pre-wrap"></pre>
      </div>

      <!-- Pickup Management -->
      <div class="section">
        <h3>Pickup Actions</h3>
        <div class="input-row">
          <input
            type="number"
            id="studentIdInput"
            placeholder="Student ID"
            value="987" />
          <input
            type="number"
            id="gradeIdInput"
            placeholder="Grade ID"
            value="106" />
          <button class="action-btn" id="sendPickupBtn">
            🚀 Request Pickup
          </button>
        </div>
        <pre id="pickupResponse"></pre>
      </div>

      <!-- System Logs -->
      <div class="section">
        <h3>System Logs</h3>
        <div id="logsContainer"></div>
      </div>
    </div>

    <script>
      let socket = null;
      let authToken = null;
      const notificationQueue = [];
      let isNotificationShowing = false;

      // Notification System
      function showNotification(message, type = 'info', duration = 4000) {
        const notification = document.createElement('div');
        notification.className = `notification ${type}`;
        notification.innerHTML = `
        <span>${message}</span>
      `;

        document
          .querySelector('.notification-container')
          .appendChild(notification);
        setTimeout(() => {
          notification.remove();
        }, duration);
      }

      // Logging System
      function addLog(message, type = 'info') {
        const logEntry = document.createElement('div');
        logEntry.className = `log-entry ${type}`;
        logEntry.innerHTML = `[${new Date().toLocaleTimeString()}] ${message}`;
        document.getElementById('logsContainer').appendChild(logEntry);
        logEntry.scrollIntoView({behavior: 'smooth'});
      }

      // Enhanced Error Handling
      function handleError(error, context = 'operation') {
        console.error(`Error in ${context}:`, error);
        addLog(`${context} failed: ${error.message}`, 'error');
        showNotification(`⚠️ ${error.message || 'An error occurred'}`, 'error');
      }

      // Socket Management
      function initializeSocket(token) {
        try {
          socket = io('https://api.ezpick.co', {
            auth: {token, role: 'CLIENT'},
            transports: ['websocket', 'polling'],
            reconnectionAttempts: 3,
            reconnectionDelay: 1000,
          });

          socket.on('connect', () => {
            updateStatus(true);
            addLog('Connected to server', 'success');
            showNotification('Connected to server', 'success');
          });

          socket.on('disconnect', reason => {
            updateStatus(false);
            addLog(`Disconnected: ${reason}`, 'error');
            if (reason === 'io server disconnect') {
              showNotification(
                'Disconnected from server. Please login again.',
                'error',
              );
            }
          });

          socket.on('connect_error', err => {
            handleError(err, 'socket connection');
            showNotification('Connection error. Retrying...', 'warning');
          });

          socket.on('_student_list', data => {
            document.getElementById('studentData').textContent = JSON.stringify(
              data,
              null,
              2,
            );
            addLog('Received student data update', 'success');
          });

          socket.on('_approved_request', data => {
            addLog('Pickup request approved', 'success');
            showNotification('✅ Pickup request approved!', 'success');
          });
        } catch (error) {
          handleError(error, 'socket initialization');
        }
      }

      // Status Indicator
      function updateStatus(connected) {
        const dot = document.querySelector('.status-dot');
        const text = document.getElementById('statusText');
        dot.className = `status-dot ${
          connected ? 'connected' : 'disconnected'
        }`;
        text.textContent = connected ? 'Connected to Server' : 'Disconnected';
      }

      // Login Handler
      document
        .getElementById('loginForm')
        .addEventListener('submit', async e => {
          e.preventDefault();
          // CORRECTED IDS HERE
          const email = document.getElementById('loginEmail').value;
          const password = document.getElementById('loginPassword').value;
          try {
            const response = await fetch(
              'https://backendtest.ezpick.org/parents/loginByEmail',
              {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email, password}),
              },
            );

            if (!response.ok) {
              throw new Error(await response.text());
            }

            const data = await response.json();
            authToken = data.token;
            document.querySelector('.login-card').style.display = 'none';
            document.getElementById('mainContainer').style.display = 'block';
            initializeSocket(data.token);
            showNotification('Login successful!', 'success');
            addLog('User logged in successfully', 'success');
          } catch (error) {
            handleError(error, 'login');
            showNotification(
              '⚠️ Login failed. Please check credentials.',
              'error',
            );
          }
        });

      // Student Data Fetch
      document
        .getElementById('fetchStudentBtn')
        .addEventListener('click', async () => {
          try {
            if (!socket?.connected) throw new Error('Not connected to server');

            socket.emit(
              '_fetch_student',
              {
                parentId: 1000001,
                socketId: socket.id,
              },
              response => {
                if (response.error) throw new Error(response.error);
                addLog('Student data refreshed', 'success');
              },
            );
          } catch (error) {
            handleError(error, 'fetch student data');
          }
        });

      // Pickup Request Handler
      document
        .getElementById('sendPickupBtn')
        .addEventListener('click', async () => {
          try {
            const studentId = parseInt(
              document.getElementById('studentIdInput').value,
            );
            const gradeId = parseInt(
              document.getElementById('gradeIdInput').value,
            );

            if (!socket?.connected) throw new Error('Not connected to server');
            if (isNaN(studentId)) throw new Error('Invalid Student ID');
            if (isNaN(gradeId)) throw new Error('Invalid Grade ID');

            const payload = {
              studentId,
              clientId: 1000000,
              parentId: 1000883,
              gradeId,
              socketId: socket.id,
            };

            socket.emit('_request_student', payload, response => {
              if (response.error) throw new Error(response.error);
              document.getElementById('pickupResponse').textContent =
                JSON.stringify(response, null, 2);
              addLog('Pickup request sent', 'success');
              showNotification(
                '🚀 Pickup request sent successfully!',
                'success',
              );
            });
          } catch (error) {
            handleError(error, 'send pickup request');
          }
        });
    </script>
  </body>
</html>
