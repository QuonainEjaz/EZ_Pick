<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student List</title>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      padding: 20px;
      background-color: #f4f4f4;
    }
    h1 {
      text-align: center;
    }
    .student-item {
      background-color: white;
      margin: 10px 0;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ddd;
    }
    .loading {
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>Student List</h1>
  <div id="loading" class="loading">Loading students...</div>
  <div id="students-container"></div>

  <script>
    // Function to simulate API call to fetch students using axios
    const fetchStudents = async () => {
      const loadingText = document.getElementById("loading");
      const container = document.getElementById("students-container");
      
      try {
        // Start fetching data using axios
        const response = await axios.get('https://backendtest.ezpick.org/students'); // Your API URL

        // Log the full response to see its structure
        console.log('API Response:', response.data);

        if (response.data.success) {
          // Hide loading text
          loadingText.style.display = "none"; 
          // Call displayStudents function to show fetched data
          displayStudents(response.data.students);
        } else {
          throw new Error('Failed to fetch students');
        }
      } catch (error) {
        loadingText.innerText = "Error fetching students: " + error.message;
        console.error('Error fetching students:', error);
      }
    };

    // Function to display students
    const displayStudents = (students) => {
      const container = document.getElementById("students-container");

      if (students && students.length > 0) {
        students.forEach(student => {
          const studentDiv = document.createElement("div");
          studentDiv.classList.add("student-item");
          studentDiv.innerHTML = `
            <h3>Name: ${student.name}</h3>
            <p>Grade: ${student.grade.grade}</p>
            <p>School: ${student.grade.school.schoolName || 'N/A'}</p>
          `;
          container.appendChild(studentDiv);
        });
      } else {
        container.innerHTML = "<p>No students available.</p>";
      }
    };

    // Simulate first load behavior when the page is loaded
    const handleFirstLoad = () => {
      console.log("First load: Fetching students...");
      fetchStudents();
    };

    // Simulate first load behavior when the page is loaded
    handleFirstLoad();
  </script>

</body>
</html>
